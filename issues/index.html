<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Past Issues — New Orleans Brief</title>
  <meta name="description" content="Browse past issues of New Orleans Brief — the weekly newsletter for New Orleans and the Greater Metro.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9884;</text></svg>">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--blue:#1e3a5f;--text:#111827;--text2:#374151;--text3:#6b7280;--border:#e5e7eb}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:#f9fafb}
    a{color:var(--blue);text-decoration:none}
    a:hover{text-decoration:underline}
    nav{background:var(--blue);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px}
    .nav-brand{font-size:18px;font-weight:800;color:white;font-family:Georgia,serif}
    .nav-sub a{color:rgba(255,255,255,.8);font-size:14px}
    .hero{background:var(--blue);color:white;padding:40px 24px 48px;text-align:center}
    .hero h1{font-family:Georgia,serif;font-size:32px;font-weight:900;margin-bottom:8px}
    .hero p{color:rgba(255,255,255,.8);font-size:15px}
    main{max-width:800px;margin:0 auto;padding:40px 24px}
    .issue-list{display:flex;flex-direction:column;gap:12px}
    .issue-item{background:white;border:1px solid var(--border);border-radius:10px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .issue-item:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(30,58,95,.1)}
    .issue-date{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);margin-bottom:4px}
    .issue-title{font-size:15px;font-weight:700;color:var(--text)}
    .issue-read{font-size:13px;font-weight:600;color:var(--blue);white-space:nowrap}
    .empty{text-align:center;padding:60px 24px;color:var(--text3)}
    footer{text-align:center;padding:24px;font-size:13px;color:var(--text3)}
    footer a{color:var(--blue)}
  </style>
</head>
<body>
<nav>
  <a href="/" class="nav-brand">New Orleans Brief</a>
  <div class="nav-sub"><a href="/subscribe/">Subscribe free &rarr;</a></div>
</nav>
<div class="hero">
  <h1>Past Issues</h1>
  <p>Every Sunday issue, archived here for easy reading.</p>
</div>
<main>
  <div class="issue-list">
    <div class="empty">
      <p>Issues coming soon. <a href="/subscribe/">Subscribe</a> to get the first one in your inbox.</p>
    </div>
  </div>
</main>
<footer>
  <a href="/">&larr; New Orleans Brief</a>&nbsp;&middot;&nbsp;<a href="/subscribe/">Subscribe free</a>
</footer>
</body>
</html>
